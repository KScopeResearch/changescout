<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロフィール登録完了 ｜ ChangeScout Weekly</title>
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --border: #e6e8ec;
    --text: #0f172a;
    --text-muted: #667085;
    --blue: #2563eb;
    --blue-soft: #eaf1ff;
    --orange: #f97316;
    --orange-soft: #fff1e6;
    --neutral-soft: #f1f2f4;
    --radius-lg: 20px;
    --radius-sm: 8px;
    --shadow: 0 20px 40px -28px rgba(15, 23, 42, 0.25);
    --shadow-sm: 0 8px 20px -16px rgba(15, 23, 42, 0.3);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
      "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand__mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--blue), var(--orange));
    flex-shrink: 0;
  }

  .brand__text {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .brand__name {
    font-weight: 800;
    font-size: 1.05rem;
  }

  .brand__sub {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .beta-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--orange-soft);
    color: var(--orange);
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    border: 1px solid #ffd9bd;
  }

  .beta-badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--orange);
  }

  .complete-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 48px 36px;
    text-align: center;
  }

  .complete-card__icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--orange));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 1.5rem;
    font-weight: 800;
  }

  .complete-card__title {
    font-size: clamp(1.3rem, 1.1rem + 0.8vw, 1.6rem);
    font-weight: 800;
    margin: 0 0 12px;
  }

  .complete-card__body {
    color: var(--text-muted);
    margin: 0 0 28px;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 32px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1rem;
    color: #fff;
    background: var(--orange);
    text-decoration: none;
    box-shadow: var(--shadow-sm);
  }

  .btn-primary:hover {
    filter: brightness(1.05);
  }

  @media (max-width: 560px) {
    .page {
      padding: 24px 16px 64px;
    }

    .complete-card {
      padding: 36px 24px;
    }
  }
</style>
</head>
<body>

<div class="page">

  <header class="topbar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <div class="brand__text">
        <span class="brand__name">ChangeScout Weekly</span>
        <span class="brand__sub">市場の変化を、ビジネスチャンスへ。</span>
      </div>
    </div>
    <span class="beta-badge">BETA</span>
  </header>

  <div class="complete-card">
    <div class="complete-card__icon" aria-hidden="true">✓</div>
    <h1 class="complete-card__title">あなた向け分析を開始します</h1>
    <p class="complete-card__body">
      入力いただいた会社プロフィールをもとに、AIが貴社に合ったビジネスチャンスの検出を開始しました。
      準備が整い次第、ダッシュボードでご確認いただけます。
    </p>
    <a class="btn-primary" href="mock-dashboard.html">ダッシュボードを見る →</a>
  </div>

</div>

</body>
</html>
