<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無料レポート | AI Opportunity Report</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/report-preview.css">
</head>
<body class="theme-blue">

<div class="page" id="page" hidden>

  <header class="report-header" id="report-header"></header>

  <main>
    <section class="section source-pages" id="source-pages"></section>

    <section class="section" id="main-opportunity">
      <h2 class="section-title">御社が狙うべきOpportunity</h2>
      <div id="main-opportunity-card"></div>
    </section>

    <section class="section" id="locked-themes"></section>

    <section class="section cta-block">
      <a href="#" class="btn btn-primary btn-cta" data-cta>追加分析を見る（無料）</a>
      <p class="cta-note">登録すると、このOpportunityの市場規模・競合状況・リスクまで踏み込んだ追加分析が見られます。</p>
    </section>
  </main>

  <footer class="report-footer" id="report-footer"></footer>

  <section class="section cta-block">
    <a href="#" class="btn btn-primary btn-cta" data-cta>追加分析を見る（無料）</a>
  </section>

</div>

<div class="state-message" id="state-loading">
  <p>レポートを読み込んでいます…</p>
</div>

<div class="state-message state-message--error" id="state-error" hidden>
  <div id="state-error-content"></div>
</div>

<script src="assets/js/common.js"></script>
<script src="assets/js/report-preview.js"></script>
</body>
</html>
