<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>御社向け 無料ビジネスチャンスレポート</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/report-preview.css">
<link rel="stylesheet" href="assets/css/preview-conversion.css">
</head>
<body class="theme-blue">

<div class="page" id="page" hidden>

  <!-- Phase66 STEP2: Initial Report 表側 UI/UX 大改修（Content SAME / Presentation NEW） -->
  <header class="report-hero" id="report-hero"></header>

  <main>
    <!-- Phase75 STEP3: Business Intelligence Dashboard を Executive Brief より上へ移動 -->
    <!-- Metrics（Market Intelligence Dashboard: KPI 4枚 + 2-up + 数字カード・比較バー・タイムライン） -->
    <section class="section" id="sec-metrics"></section>

    <!-- Phase75 STEP2: Executive Brief（30秒で伝わる4カード。旧 Executive Summary を置換） -->
    <section class="section" id="sec-exec-summary"></section>

    <!-- WHY NOW（なぜ今なのか・全文） -->
    <section class="section" id="sec-why-now"></section>

    <!-- WHY YOU（なぜ御社なのか・全文） -->
    <section class="section" id="sec-why-you"></section>

    <!-- THE OPPORTUNITY（一言でいうと → 期待できること → 確信度） -->
    <section class="section" id="sec-opportunity"></section>

    <!-- Phase68 STEP7: Why This Opportunity Matters（3 Insight Cards） -->
    <section class="section" id="sec-why-matters"></section>

    <!-- この提案の根拠（折りたたみ。Phase75 STEP7: 先頭3件 + さらに表示） -->
    <section class="section" id="sec-evidence"></section>

    <!-- 今回の分析で確認した情報源（折りたたみ・最後） -->
    <section class="section" id="sec-sources"></section>

    <!-- ほかの検討テーマ（MORE OPPORTUNITIES） -->
    <section class="section" id="sec-locked"></section>

    <!-- 安心要素（メールアドレス登録だけ / 専門家監修 / 無料版を毎週配信 / 停止可能） -->
    <section class="section" id="sec-trust"></section>

    <!-- 下部 CTA -->
    <section class="section cta-block cta-v2" id="sec-cta"></section>
  </main>

  <footer class="report-footer" id="report-footer"></footer>

</div>

<div class="state-message" id="state-loading">
  <p>レポートを読み込んでいます…</p>
</div>

<div class="state-message state-message--error" id="state-error" hidden>
  <div id="state-error-content"></div>
</div>

<script src="assets/js/summary-guard.js"></script>
<script src="assets/js/market-stats.js"></script>
<script src="assets/js/preview-ui.js"></script>
<script src="assets/js/illustrations.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/report-preview.js"></script>
</body>
</html>
