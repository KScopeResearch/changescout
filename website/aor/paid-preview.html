<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>詳細レポート（有料版） | AI Opportunity Report</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/paid-preview.css">
</head>
<body class="theme-purple">

<div class="page" id="page" hidden>

  <header class="report-header" id="report-header"></header>

  <main>
    <section class="section" id="decision-summary"></section>

    <section class="section" id="additional-opportunities">
      <h2 class="section-title">追加Opportunity</h2>
      <div class="cards" id="additional-opportunities-list"></div>
    </section>

    <section class="section" id="priority-matrix">
      <h2 class="section-title">優先順位マトリクス</h2>
      <div class="matrix" id="priority-matrix-grid"></div>
    </section>

    <section class="section" id="roadmap">
      <h2 class="section-title">90日実行ロードマップ</h2>
      <div class="timeline" id="roadmap-timeline"></div>
    </section>

    <section class="section" id="execution-support">
      <h2 class="section-title">実行支援メニュー</h2>
      <div class="cards" id="execution-support-list"></div>
    </section>

    <section class="section" id="monitoring">
      <h2 class="section-title">継続監視テーマ</h2>
      <ul class="monitor-list" id="monitoring-list"></ul>
    </section>

    <section class="section cta-block price-panel" id="price-panel">
      <h2 class="section-title">有料プランのご案内</h2>
      <p class="price-panel__price">Standardプラン: 月額数千円〜1万円台（目安）</p>
      <a href="#" id="upgrade-cta" class="btn btn-primary btn-cta">有料プランに申し込む</a>
      <a href="#" id="consult-cta" class="btn btn-secondary btn-cta">営業担当に相談する</a>
      <p class="price-panel__note">本モックはPhase1の静的モックのため、オンライン決済は行われません。お申し込み後、担当者よりご連絡します。</p>
    </section>
  </main>

  <footer class="report-footer" id="report-footer"></footer>

</div>

<div class="state-message" id="state-loading">
  <p>読み込んでいます…</p>
</div>

<div class="state-message state-message--error" id="state-error" hidden>
  <div id="state-error-content"></div>
</div>

<script src="assets/js/common.js"></script>
<script src="assets/js/paid-preview.js"></script>
</body>
</html>
