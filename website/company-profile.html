<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会社プロフィール ｜ ChangeScout Weekly</title>
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --border: #e6e8ec;
    --text: #0f172a;
    --text-muted: #667085;
    --blue: #2563eb;
    --blue-soft: #eaf1ff;
    --orange: #f97316;
    --orange-soft: #fff1e6;
    --neutral-soft: #f1f2f4;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 8px;
    --shadow: 0 20px 40px -28px rgba(15, 23, 42, 0.25);
    --shadow-sm: 0 8px 20px -16px rgba(15, 23, 42, 0.3);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
      "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand__mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--blue), var(--orange));
    flex-shrink: 0;
  }

  .brand__text {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .brand__name {
    font-weight: 800;
    font-size: 1.05rem;
  }

  .brand__sub {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .beta-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--orange-soft);
    color: var(--orange);
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    border: 1px solid #ffd9bd;
  }

  .beta-badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--orange);
  }

  .eyebrow {
    display: block;
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--blue);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0 0 10px;
  }

  .page-title {
    margin: 0 0 10px;
    font-size: clamp(1.4rem, 1.15rem + 1vw, 1.8rem);
    font-weight: 800;
  }

  .page-lead {
    margin: 0 0 32px;
    color: var(--text-muted);
  }

  .panel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 32px;
  }

  .form-section {
    margin-bottom: 26px;
  }

  .form-section:last-of-type {
    margin-bottom: 0;
  }

  .form-section__label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .form-section__hint {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin: -4px 0 10px;
  }

  input[type="text"],
  select {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
  }

  input:focus,
  select:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-soft);
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 14px 28px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1rem;
    color: #fff;
    background: var(--orange);
    border: none;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    margin-top: 8px;
  }

  .btn-primary:hover {
    filter: brightness(1.05);
  }

  .form-note {
    margin: 14px 0 0;
    font-size: 0.78rem;
    color: var(--text-muted);
    text-align: center;
  }

  @media (max-width: 560px) {
    .page {
      padding: 24px 16px 64px;
    }

    .panel-card {
      padding: 24px;
    }
  }
</style>
</head>
<body>

<div class="page">

  <header class="topbar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <div class="brand__text">
        <span class="brand__name">ChangeScout Weekly</span>
        <span class="brand__sub">市場の変化を、ビジネスチャンスへ。</span>
      </div>
    </div>
    <span class="beta-badge">BETA</span>
  </header>

  <p class="eyebrow">COMPANY PROFILE ・ 所要時間 約2分</p>
  <h1 class="page-title">あなた向けの分析のために、<br>会社プロフィールを教えてください</h1>
  <p class="page-lead">
    <strong>あなたの会社に関連する市場変化だけを分析するため</strong>に、いくつかの質問にお答えください。
    業種・顧客層・商材・営業地域をもとに、AIが貴社に合ったビジネスチャンスだけを選び出します。
  </p>

  <div class="panel-card">
    <form action="profile-complete.html" method="get">

      <div class="form-section">
        <label class="form-section__label" for="companyName">企業名<span style="font-weight:400;color:var(--text-muted);">（任意）</span></label>
        <p class="form-section__hint">レポート表示に使用します。個人事業主の場合は屋号等でも構いません</p>
        <input type="text" id="companyName" name="companyName" placeholder="例：株式会社サンプル商事">
      </div>

      <div class="form-section">
        <label class="form-section__label" for="industry">業種</label>
        <select id="industry" name="industry" required>
          <option value="">選択してください</option>
          <option value="it-dx">IT・DX支援</option>
          <option value="construction">建設</option>
          <option value="professional">士業</option>
          <option value="manufacturing">製造業</option>
          <option value="other">その他</option>
        </select>
      </div>

      <div class="form-section">
        <label class="form-section__label" for="customerSegment">顧客層</label>
        <p class="form-section__hint">主にどのような企業を顧客としていますか</p>
        <input type="text" id="customerSegment" name="customerSegment" placeholder="例：製造業の中小企業（従業員50〜300名）" required>
      </div>

      <div class="form-section">
        <label class="form-section__label" for="product">商材</label>
        <p class="form-section__hint">提供しているサービス・製品を教えてください</p>
        <input type="text" id="product" name="product" placeholder="例：ERPパッケージ導入支援" required>
      </div>

      <div class="form-section">
        <label class="form-section__label" for="region">営業地域</label>
        <select id="region" name="region" required>
          <option value="">選択してください</option>
          <option value="nationwide">全国</option>
          <option value="kanto">関東</option>
          <option value="kansai">関西</option>
          <option value="chubu">中部・東海</option>
          <option value="kyushu">九州・沖縄</option>
          <option value="other">その他</option>
        </select>
      </div>

      <button type="submit" class="btn-primary">プロフィールを保存する</button>
      <p class="form-note">入力内容は分析のパーソナライズにのみ使用します。</p>
    </form>
  </div>

</div>

<script>
  document.querySelector("form").addEventListener("submit", (event) => {
    const profile = Object.fromEntries(new FormData(event.target).entries());
    localStorage.setItem("changescout_profile", JSON.stringify(profile));
  });
</script>

</body>
</html>
