<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会社プロフィール入力 ｜ ChangeScout Weekly</title>
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --border: #e6e8ec;
    --text: #0f172a;
    --text-muted: #667085;
    --blue: #2563eb;
    --blue-soft: #eaf1ff;
    --orange: #f97316;
    --orange-soft: #fff1e6;
    --neutral-soft: #f1f2f4;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 8px;
    --shadow: 0 20px 40px -28px rgba(15, 23, 42, 0.25);
    --shadow-sm: 0 8px 20px -16px rgba(15, 23, 42, 0.3);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
      "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand__mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--blue), var(--orange));
    flex-shrink: 0;
  }

  .brand__text {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .brand__name {
    font-weight: 800;
    font-size: 1.05rem;
  }

  .brand__sub {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .beta-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--orange-soft);
    color: var(--orange);
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    border: 1px solid #ffd9bd;
  }

  .beta-badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--orange);
  }

  .eyebrow {
    display: block;
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--blue);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0 0 10px;
  }

  .page-title {
    margin: 0 0 10px;
    font-size: clamp(1.4rem, 1.15rem + 1vw, 1.8rem);
    font-weight: 800;
  }

  .page-lead {
    margin: 0 0 32px;
    color: var(--text-muted);
  }

  .panel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 32px;
  }

  .form-section {
    margin-bottom: 26px;
  }

  .form-section:last-of-type {
    margin-bottom: 0;
  }

  .form-section__label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .form-section__hint {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin: -4px 0 10px;
  }

  input[type="text"],
  input[type="number"],
  select {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
  }

  input:focus,
  select:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-soft);
  }

  .checkbox-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .checkbox-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    font-size: 0.88rem;
    cursor: pointer;
  }

  .checkbox-option input {
    accent-color: var(--blue);
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 14px 28px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1rem;
    color: #fff;
    background: var(--orange);
    border: none;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    margin-top: 8px;
  }

  .btn-primary:hover {
    filter: brightness(1.05);
  }

  .form-note {
    margin: 14px 0 0;
    font-size: 0.78rem;
    color: var(--text-muted);
    text-align: center;
  }

  @media (max-width: 560px) {
    .page {
      padding: 24px 16px 64px;
    }

    .panel-card {
      padding: 24px;
    }

    .checkbox-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div class="page">

  <header class="topbar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <div class="brand__text">
        <span class="brand__name">ChangeScout Weekly</span>
        <span class="brand__sub">市場の変化を、ビジネスチャンスへ。</span>
      </div>
    </div>
    <span class="beta-badge">BETA</span>
  </header>

  <p class="eyebrow">SETUP ・ 1/1</p>
  <h1 class="page-title">貴社のビジネスチャンスを見つけるために、<br>会社プロフィールを教えてください</h1>
  <p class="page-lead">
    ここで入力した内容は、貴社に関連する業界・商談規模・対象企業数の分析に使われます。
    後から設定画面でいつでも変更できます。
  </p>

  <div class="panel-card">
    <form action="mock-dashboard.html" method="get">

      <div class="form-section">
        <label class="form-section__label" for="companyName">会社名</label>
        <input type="text" id="companyName" name="companyName" placeholder="例：株式会社フィールドDX" required>
      </div>

      <div class="form-section">
        <label class="form-section__label" for="industry">業種</label>
        <select id="industry" name="industry" required>
          <option value="">選択してください</option>
          <option value="it-dx">IT・DX支援</option>
          <option value="construction">建設</option>
          <option value="professional">士業</option>
          <option value="manufacturing">製造業</option>
          <option value="other">その他</option>
        </select>
      </div>

      <div class="form-section">
        <span class="form-section__label">主なターゲット業種（複数選択可）</span>
        <p class="form-section__hint">「業種別内訳」チャートの分析対象になります</p>
        <div class="checkbox-grid">
          <label class="checkbox-option"><input type="checkbox" name="targetIndustry" value="manufacturing" checked>製造業</label>
          <label class="checkbox-option"><input type="checkbox" name="targetIndustry" value="construction" checked>建設業</label>
          <label class="checkbox-option"><input type="checkbox" name="targetIndustry" value="retail">卸売・小売業</label>
          <label class="checkbox-option"><input type="checkbox" name="targetIndustry" value="other">その他</label>
        </div>
      </div>

      <div class="form-section">
        <label class="form-section__label" for="dealSize">平均商談単価（概算）</label>
        <select id="dealSize" name="dealSize" required>
          <option value="">選択してください</option>
          <option value="lt50">〜50万円</option>
          <option value="50-200">50〜200万円</option>
          <option value="200-500">200〜500万円</option>
          <option value="gt500">500万円〜</option>
        </select>
      </div>

      <div class="form-section">
        <label class="form-section__label" for="existingCustomers">既存顧客数（概算）</label>
        <input type="number" id="existingCustomers" name="existingCustomers" min="0" placeholder="例：18" required>
      </div>

      <div class="form-section">
        <span class="form-section__label">関心のある変化の種類（複数選択可）</span>
        <div class="checkbox-grid">
          <label class="checkbox-option"><input type="checkbox" name="interest" value="subsidy" checked>補助金</label>
          <label class="checkbox-option"><input type="checkbox" name="interest" value="law" checked>法改正</label>
          <label class="checkbox-option"><input type="checkbox" name="interest" value="news">業界ニュース</label>
          <label class="checkbox-option"><input type="checkbox" name="interest" value="newservice">新サービス動向</label>
        </div>
      </div>

      <button type="submit" class="btn-primary">分析を開始する</button>
      <p class="form-note">入力内容は分析のパーソナライズにのみ使用します。</p>
    </form>
  </div>

</div>

</body>
</html>
