name: Deploy AOR Web

# PJ2 AOP Step3次工程: website/aor/ への変更をpushしたら、公開用S3
# （changescout-pj2-aor-web-179127602551）+ CloudFront（E1TGUCT9CYALRK）へ自動反映する。
#
# 【重要: 現時点ではこのworkflowはまだ動作しません】
# AWSへの認証手段（GitHub Actions OIDC用のIAM OIDC Provider / IAM Role）が
# まだ作成されていないため、"Configure AWS credentials" ステップで必ず失敗します。
# 新規IAM Role/OIDC Providerの作成は今回のセッションでは意図的に行っておらず、
# 別途の承認・実施が必要です（詳細は scripts/generator/deploy-aor-web.js の
# 導入経緯・報告内容を参照）。role-to-assume の値はプレースホルダーのままです。
#
# 既存Lead保存用S3（changescout-pj2-leads-179127602551）とは完全に別のバケット・
# 別の権限スコープを想定しており、このworkflowに付与するIAM Roleの権限は
# 公開用バケットとこのCloudFrontディストリビューションのみに限定すべきです。

on:
  push:
    branches: ["**"]
    paths:
      - "website/aor/**"
  workflow_dispatch: {}

permissions:
  id-token: write # GitHub Actions OIDC用（IAM Role作成後に有効化される）
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # 公開前に既存の品質ゲートを必ず通す（既存quality-check.ymlと同じ基準）。
      - name: Run quality gate
        run: node scripts/generator/run-all-tests.js

      # TODO: role-to-assume は、IAM OIDC Provider・IAM Role作成後に実際のARNへ置き換えること。
      # 現時点ではプレースホルダーのため、このステップは必ず失敗する。
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::179127602551:role/REPLACE_WITH_ACTUAL_ROLE_ARN"
          aws-region: ap-northeast-1

      # 安全性チェック（deploy-aor-web.js内でcheckPublicDataSafety()として実行）に
      # 失敗した場合、この一連の処理は1件もアップロードせずに失敗する。
      - name: Deploy website/aor/ to S3 + invalidate CloudFront
        env:
          AOR_WEB_S3_BUCKET: changescout-pj2-aor-web-179127602551
          AWS_REGION: ap-northeast-1
          AOR_WEB_CLOUDFRONT_DISTRIBUTION_ID: E1TGUCT9CYALRK
        run: node scripts/generator/deploy-aor-web.js
