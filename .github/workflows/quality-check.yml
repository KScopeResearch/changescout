name: Quality Check

# Task19: AORジェネレータ（scripts/generator/）の自動品質チェック。
# push / pull_request の両方で実行し、scripts/generator/run-all-tests.js の
# 終了コードでジョブの成否を判定する。

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Task19: ローカル開発環境（v24.18.0）と合わせ、メジャーバージョン24に固定する。
          # 理由の詳細は scripts/generator/README.md の「CIのNode.jsバージョンについて」を参照。
          node-version: "24"

      # このリポジトリには package.json が存在しない（意図的な設計。
      # scripts/generator 配下はNode.js標準モジュールのみで実装されており、
      # npm依存パッケージを一切使用していないため）。
      # したがって `npm install` / `npm ci` のステップは不要であり、実行しない。
      - name: (npm install不要) 依存パッケージなしのプロジェクトです
        run: echo "package.json が存在せず、npmパッケージへの依存がないため npm install をスキップします。"

      - name: Run quality gate (scripts/generator/run-all-tests.js)
        id: run_all_tests
        run: node scripts/generator/run-all-tests.js

      # Task19: run-all-tests.js が失敗（非0終了）した場合でも quality-report.md を
      # 取得できるよう、成功/失敗に関わらず（if: always()）アーティファクトとして保存する。
      - name: Upload quality-report.md as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: scripts/generator/quality-report.md
          if-no-files-found: warn
